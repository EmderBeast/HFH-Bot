[potbot]
; Sprache / language: de = Deutsch, en = English. Leer: fragt beim Start / empty: asks at start.
language = en
; Pfad zu adb.exe. Leer: sucht selbst im LDPlayer-Ordner.
; Path to adb.exe. Empty: looks in the LDPlayer folder by itself.
adb =
; Nur bei mehreren LDPlayer-Fenstern, z. B. emulator-5556. Leer: das erste.
; Only with several LDPlayer windows, e.g. emulator-5556. Empty: the first one.
geraet =
; Höchstens so viele Spieler mit den Pfeilen durchgehen / at most this many players via the arrows.
max_spieler = 1000
; Pausen nach dem Tippen: 0.7 = schnell (Standard), 1.0 = wie bis 1.14. Bei Fehlern erhöhen.
; Pauses after a tap: 0.7 = fast (default), 1.0 = as up to 1.14. Raise it if the bot makes mistakes.
tempo = 0.7
; Account-Scan: nur Spieler ab dieser Stufe lesen (2 bis 70). Bei der ersten Karte darunter hört der Scan auf.
; Account scan: read only players from this level on (2 to 70). The scan stops at the first card below it.
min_level = 2
